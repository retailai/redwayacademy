{% extends "base.html" %}
{% block content %}
<p><a href="{{ url_for('admin_homework') }}">← Homework</a></p>
<h1>Edit homework</h1>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Title <input name="title" required value="{{ hw.title }}"></label>
<label>Class <input name="class_level" required value="{{ hw.class_level }}"></label>
<label>Details <textarea name="details">{{ hw.details }}</textarea></label>
<button class="btn" type="submit">Save changes</button>
</form>
{% endblock %}
