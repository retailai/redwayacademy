{% extends "base.html" %}
{% block content %}
<h1>Register</h1><p>Register with your phone number. Students and parents can self-register. The first teacher becomes Super Admin; later teachers are added by an admin.</p>
<form method="post">
<label>Name <input name="name" required></label>
<label>Phone number <input name="phone" required placeholder="01XXXXXXXXX"></label>
<label>Password <input type="password" name="password" required></label>
<label>Role <select name="role"><option value="student">Student</option><option value="parent">Parent</option><option value="teacher">Teacher / Admin</option></select></label>
<label>Class (students) <input name="class_level" placeholder="6, 7, 8, 9-10 or 11-12"></label>
<label>Linked student phone (parents only) <input name="linked_student_phone" placeholder="01XXXXXXXXX"></label>
<button class="btn" type="submit">Register</button></form>
{% endblock %}
